<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">GreenPost video editing pipeline</title>
  <desc id="desc">A dark production composition showing a vertical clip, active speaker framing and animated captions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17231b"/>
      <stop offset="1" stop-color="#0c1110"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9dc62"/>
      <stop offset="1" stop-color="#4e9a62"/>
    </linearGradient>
    <linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9ad78"/>
      <stop offset="0.52" stop-color="#6a5475"/>
      <stop offset="1" stop-color="#273f38"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="34" y="34" width="1532" height="932" rx="20" fill="#121815" stroke="#ecf5e4" stroke-opacity=".14"/>
  <rect x="34" y="34" width="1532" height="68" rx="20" fill="#1c261f"/>
  <path d="M34 102h1532" stroke="#ecf5e4" stroke-opacity=".12"/>
  <circle cx="72" cy="68" r="8" fill="#9ed966"/>
  <text x="96" y="75" fill="#f5faef" font-family="Arial, sans-serif" font-size="22" font-weight="600">greenpost</text>
  <text x="1283" y="74" fill="#899a8b" font-family="monospace" font-size="14" letter-spacing="1.8">RENDER / 09</text>
  <rect x="60" y="126" width="230" height="672" rx="12" fill="#18201b"/>
  <text x="90" y="170" fill="#829083" font-family="monospace" font-size="12" letter-spacing="1.6">PROJECT</text>
  <text x="90" y="208" fill="#f2f7ec" font-family="Arial, sans-serif" font-size="23" font-weight="600">Interview cut</text>
  <path d="M90 255h164M90 290h122M90 325h148" stroke="#536256" stroke-width="8" stroke-linecap="round"/>
  <rect x="90" y="391" width="168" height="94" rx="9" fill="#26362a" stroke="#88b37d" stroke-opacity=".6"/>
  <path d="M108 455h118" stroke="#9ed966" stroke-width="4" stroke-linecap="round"/>
  <text x="108" y="422" fill="#c4dcba" font-family="monospace" font-size="11" letter-spacing="1.3">TRANSCRIPT</text>
  <text x="90" y="730" fill="#6e7e70" font-family="monospace" font-size="11" letter-spacing="1.4">AI / ACTIVE SPEAKER</text>
  <g filter="url(#shadow)">
    <rect x="363" y="145" width="564" height="652" rx="12" fill="#e8e4d7"/>
    <rect x="393" y="175" width="504" height="418" rx="8" fill="url(#portrait)"/>
    <path d="M393 422c70-80 166-109 252-80 76 26 153 76 252 44v207H393Z" fill="#1b342f" fill-opacity=".8"/>
    <circle cx="674" cy="330" r="75" fill="#f0bc88" fill-opacity=".7"/>
    <path d="M606 304c30-59 116-63 152 4-33-10-80 3-114 32Z" fill="#34282c"/>
    <path d="M628 356h91" stroke="#7b493f" stroke-width="7" stroke-linecap="round"/>
    <rect x="441" y="491" width="154" height="63" rx="9" fill="#a9dc62"/>
    <text x="459" y="518" fill="#213120" font-family="monospace" font-size="11" letter-spacing="1.2">ACTIVE SPEAKER</text>
    <text x="459" y="543" fill="#213120" font-family="Arial, sans-serif" font-size="15" font-weight="600">Frame 04</text>
    <text x="393" y="648" fill="#1d2720" font-family="monospace" font-size="11" letter-spacing="1.4">CAPTION PREVIEW</text>
    <text x="393" y="699" fill="#1d2720" font-family="Arial, sans-serif" font-size="28" font-weight="700">Make the moment</text>
    <text x="393" y="733" fill="#5b6659" font-family="Arial, sans-serif" font-size="21">feel like it matters.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="989" y="145" width="520" height="260" rx="12" fill="#1e2b22" stroke="#a9dc62" stroke-opacity=".35"/>
    <text x="1024" y="188" fill="#95ae8f" font-family="monospace" font-size="12" letter-spacing="1.6">CLIP SELECTION</text>
    <text x="1024" y="246" fill="#f2f7ec" font-family="Arial, sans-serif" font-size="28" font-weight="600">A good cut is a good edit.</text>
    <path d="M1024 288h412" stroke="#58715c" stroke-width="8" stroke-linecap="round"/>
    <path d="M1024 324h275" stroke="#405846" stroke-width="8" stroke-linecap="round"/>
    <rect x="1383" y="301" width="78" height="41" rx="20" fill="#a9dc62"/>
    <text x="1401" y="327" fill="#213120" font-family="monospace" font-size="11">READY</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="989" y="441" width="520" height="356" rx="12" fill="#111613" stroke="#ecf5e4" stroke-opacity=".12"/>
    <text x="1024" y="484" fill="#899a8b" font-family="monospace" font-size="12" letter-spacing="1.6">TIMELINE / 09 CLIPS</text>
    <path d="M1024 531h415" stroke="#2e3c31" stroke-width="2"/>
    <path d="M1024 603h415M1024 675h415" stroke="#273229" stroke-width="2"/>
    <rect x="1024" y="547" width="122" height="40" rx="7" fill="#4e9a62"/>
    <rect x="1155" y="547" width="182" height="40" rx="7" fill="#6c8a50"/>
    <rect x="1346" y="547" width="93" height="40" rx="7" fill="#9c8057"/>
    <rect x="1024" y="619" width="190" height="40" rx="7" fill="#263b2a"/>
    <rect x="1224" y="619" width="215" height="40" rx="7" fill="#324a35"/>
    <rect x="1024" y="691" width="268" height="40" rx="7" fill="#22462f"/>
    <path d="M1024 765h128" stroke="#a9dc62" stroke-width="8" stroke-linecap="round"/>
    <text x="1172" y="770" fill="#839384" font-family="monospace" font-size="11">8:01 → 3:43</text>
  </g>
  <text x="76" y="916" fill="#6d7c6e" font-family="monospace" font-size="12" letter-spacing="1.5">RENDER SURFACE / OVERVIEW</text>
