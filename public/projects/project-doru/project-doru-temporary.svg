    <text x="143" y="373" fill="#9493b1" font-family="monospace" font-size="12" letter-spacing="1.6">CONVERSATION / 04</text>
    <text x="143" y="431" fill="#f3f2ff" font-family="Arial, sans-serif" font-size="25" font-weight="600">You don’t need a cloud</text>
    <text x="143" y="466" fill="#aaaac6" font-family="Arial, sans-serif" font-size="20">to feel a response.</text>
    <path d="M143 515h347" stroke="#31334b" stroke-width="2"/>
    <path d="M143 577c18-25 24 22 41 0s27-37 41 0 24 43 43 0 27-34 43 0 26 35 44 0 31-42 48 0 28 38 42 0" fill="none" stroke="#8d8bf2" stroke-width="4" stroke-linecap="round"/>
    <text x="143" y="666" fill="#777792" font-family="monospace" font-size="11" letter-spacing="1.4">SHERPA-ONNX / KOKORO / WEBSOCKET</text>
    <circle cx="523" cy="664" r="8" fill="#8d8bf2"/>
