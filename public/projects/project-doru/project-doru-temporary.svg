<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Project Doru real-time avatar</title>
  <desc id="desc">A low-light composition of an expressive avatar, streaming speech waveform and local inference status.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17192a"/>
      <stop offset="0.55" stop-color="#11121c"/>
      <stop offset="1" stop-color="#08090d"/>
    </linearGradient>
    <radialGradient id="halo" cx="70%" cy="47%" r="55%">
      <stop offset="0" stop-color="#6d6cd4" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#4c4b9c" stop-opacity=".13"/>
      <stop offset="1" stop-color="#181927" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5b6aa"/>
      <stop offset=".45" stop-color="#b47b9b"/>
      <stop offset="1" stop-color="#5d578b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="25" flood-color="#000" flood-opacity=".48"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#halo)"/>
  <rect x="34" y="34" width="1532" height="932" rx="20" fill="none" stroke="#e7e5ff" stroke-opacity=".16"/>
  <path d="M34 102h1532" stroke="#e7e5ff" stroke-opacity=".1"/>
  <circle cx="72" cy="68" r="8" fill="#8d8bf2"/>
  <text x="96" y="75" fill="#f1f0ff" font-family="Arial, sans-serif" font-size="22" font-weight="600">project doru</text>
  <text x="1290" y="74" fill="#9392ae" font-family="monospace" font-size="14" letter-spacing="1.8">LIVE / LOCAL</text>
  <g opacity=".4">
    <path d="M135 185h640M135 218h490M135 251h580" stroke="#8584b7" stroke-width="1"/>
    <path d="M1070 184h326M1110 217h286M1036 250h360" stroke="#8584b7" stroke-width="1"/>
  </g>
