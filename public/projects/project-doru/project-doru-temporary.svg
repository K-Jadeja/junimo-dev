    <text x="1280" y="852" fill="#a8a7c4" font-family="monospace" font-size="12" letter-spacing="1.5">LIVE2D / PIXIJS</text>
  </g>
  <text x="76" y="916" fill="#777792" font-family="monospace" font-size="12" letter-spacing="1.5">REAL-TIME SYSTEM / OVERVIEW</text>
