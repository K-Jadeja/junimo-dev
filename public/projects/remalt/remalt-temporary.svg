    <text x="613" y="373" fill="#666975" font-family="Arial, sans-serif" font-size="17">Agent / platform / proof</text>
    <path d="M613 408h258" stroke="#d8dbe1" stroke-width="8" stroke-linecap="round"/>
  </g>
