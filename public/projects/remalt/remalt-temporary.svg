<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Remalt visual workspace</title>
  <desc id="desc">A dark editorial composition of connected ideas, research and AI workflows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161a22"/>
      <stop offset="1" stop-color="#0c0e12"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d87ff"/>
      <stop offset="1" stop-color="#315cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#dce3ff" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="34" y="34" width="1532" height="932" rx="20" fill="#111419" stroke="#f0f3ff" stroke-opacity=".14"/>
  <rect x="34" y="34" width="1532" height="68" rx="20" fill="#181c23"/>
  <path d="M34 102h1532" stroke="#f0f3ff" stroke-opacity=".12"/>
