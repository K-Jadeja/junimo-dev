    <rect x="868" y="601" width="434" height="226" rx="14" fill="#1e2520" stroke="#8fb782" stroke-opacity=".45"/>
    <text x="904" y="647" fill="#a2bd96" font-family="monospace" font-size="13" letter-spacing="1.6">CONNECTED OUTPUT</text>
    <text x="904" y="706" fill="#f1f5e9" font-family="Arial, sans-serif" font-size="31" font-weight="600">Platform drafts</text>
    <text x="904" y="748" fill="#a7b4a0" font-family="Arial, sans-serif" font-size="18">LinkedIn / YouTube / Instagram</text>
    <path d="M904 785h310" stroke="#6e8a64" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="76" y="916" fill="#6d7581" font-family="monospace" font-size="12" letter-spacing="1.5">SYSTEM OVERVIEW / VISUAL COMPOSITION</text>
