    <text x="1084" y="335" fill="#ffffff" font-family="Arial, sans-serif" font-size="29" font-weight="600">Research → write</text>
    <text x="1084" y="374" fill="#d7ddff" font-family="Arial, sans-serif" font-size="18">A reusable system</text>
    <circle cx="1300" cy="391" r="8" fill="#fff" fill-opacity=".85"/>
  </g>
