    <text x="390" y="637" fill="#3a2419" font-family="monospace" font-size="13" letter-spacing="1.6">INPUT / MEDIA</text>
    <text x="390" y="694" fill="#241811" font-family="Arial, sans-serif" font-size="30" font-weight="600">Video notes</text>
    <text x="390" y="734" fill="#674330" font-family="Arial, sans-serif" font-size="18">drop, connect, reuse</text>
    <path d="M390 774h228" stroke="#a56e48" stroke-width="8" stroke-linecap="round"/>
  </g>
