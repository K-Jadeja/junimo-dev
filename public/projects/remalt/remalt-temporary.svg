  <text x="1305" y="74" fill="#7e8796" font-family="monospace" font-size="14" letter-spacing="1.8">BOARD / 01</text>
  <rect x="58" y="126" width="1484" height="814" rx="12" fill="url(#grid)"/>
  <path d="M348 415C492 322 539 309 684 352M787 388c121-95 181-109 318-67M887 566c99 69 158 93 288 87M559 673c110-25 149-18 250 39" fill="none" stroke="#7186dc" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
  <circle cx="348" cy="415" r="7" fill="#7186dc"/>
  <circle cx="684" cy="352" r="7" fill="#7186dc"/>
  <circle cx="787" cy="388" r="7" fill="#7186dc"/>
  <circle cx="1105" cy="321" r="7" fill="#7186dc"/>
  <circle cx="887" cy="566" r="7" fill="#7186dc"/>
  <circle cx="1175" cy="653" r="7" fill="#7186dc"/>
  <circle cx="559" cy="673" r="7" fill="#7186dc"/>
  <circle cx="809" cy="712" r="7" fill="#7186dc"/>
  <g filter="url(#shadow)">
    <rect x="151" y="246" width="362" height="222" rx="14" fill="#242a35" stroke="#e8edff" stroke-opacity=".2"/>
    <rect x="181" y="279" width="74" height="8" rx="4" fill="#6d87ff"/>
    <text x="181" y="327" fill="#fafbff" font-family="Arial, sans-serif" font-size="28" font-weight="600">Research notes</text>
    <text x="181" y="366" fill="#8f99aa" font-family="Arial, sans-serif" font-size="18">Audience, voice, signal</text>
    <path d="M181 408h185" stroke="#525d6f" stroke-width="8" stroke-linecap="round"/>
    <path d="M181 430h124" stroke="#3e4757" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g filter="url(#shadow)">
